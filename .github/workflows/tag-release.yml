# Cuts a release by hand: Actions → Tag release → Run workflow.
#
# Picks the next version (bump of the latest v* tag, or an explicit version), renames the
# CHANGELOG's "## Unreleased" heading to it, commits "release: X.Y.Z" to main, tags vX.Y.Z,
# creates the GitHub release with that CHANGELOG section as notes, then dispatches release.yml to
# publish to npm. The dispatch is explicit because a release created with GITHUB_TOKEN does not
# trigger release.yml's `release: published` event; publishing stays in release.yml, which is
# the workflow npm trusted publishing is bound to.
#
# Pushing the release commit to main needs GitHub Actions in the main ruleset's bypass list.
name: Tag release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the latest version to bump (ignored when version is set)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Explicit version instead of a bump, e.g. 0.15.0 or 0.15.0-beta.1
        required: false
        type: string

permissions:
  contents: write # release commit, tag, GitHub release
  actions: write # dispatch release.yml

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Pick the version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          if [[ -n "$EXPLICIT" ]]; then
            VERSION="${EXPLICIT#v}"
          else
            LATEST=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            case "$BUMP" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              *) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semver version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Rename the Unreleased CHANGELOG section
        run: |
          if grep -q '^## Unreleased$' CHANGELOG.md; then
            sed -i "s/^## Unreleased\$/## $VERSION/" CHANGELOG.md
          else
            echo "::warning::CHANGELOG.md has no '## Unreleased' section"
          fi
          # The section's body, up to the next "## " heading, is the release notes.
          awk -v h="## $VERSION" '$0 == h {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Commit, tag and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git commit -am "release: $VERSION"
          fi
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=()
          [[ "$VERSION" == *-* ]] && FLAGS+=(--prerelease)
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${FLAGS[@]}"

      - name: Publish to npm (release.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f tag="v$VERSION"
