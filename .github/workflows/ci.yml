# Runs on every pull request and push to main. `check` (lint, format, typecheck, build) and
# `test` (test.yml) are the required status checks in the main branch ruleset, so auto-merge
# waits for both.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Changelog entries go in changes/unreleased/ (one file per PR); only a release/X.Y.Z PR
      # edits CHANGELOG.md, so parallel PRs never conflict on it.
      - name: CHANGELOG.md is only edited by release PRs
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "::error::Add a fragment in changes/unreleased/ instead of editing CHANGELOG.md (see changes/unreleased/README.md)."
            exit 1
          fi

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # pnpm check minus the tests, which run in test.yml.
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build

      # Every published entry point imports under plain Node ESM, not only through a bundler (#236).
      - run: node scripts/check-dist-imports.mjs
