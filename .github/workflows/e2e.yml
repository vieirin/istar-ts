# Runs the playground's Playwright suite (#48) on every pull request. Not a required status
# check yet — the orchestrator promotes it once it's proven stable (see #48).
name: E2E

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter playground exec playwright install --with-deps chromium

      - run: pnpm --filter playground e2e
